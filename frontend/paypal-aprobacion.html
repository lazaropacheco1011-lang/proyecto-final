<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorizando pago PayPal | RefriMaster</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      color: #0F172A;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      box-shadow: 0 20px 50px -20px rgba(2, 6, 23, 0.25);
      max-width: 420px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 4px solid #E0F2FE;
      border-top-color: #0284C7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #475569; font-size: 15px; margin: 0; }
    a { color: #0284C7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Autorizando tu pago con PayPal</h1>
    <p>Estamos confirmando la transacción. Serás redirigido automáticamente a la confirmación del pedido.</p>
    <p style="margin-top: 16px; font-size: 13px;">Si la página no se redirige en unos segundos, <a id="manualLink" href="/checkout/exito/">haz clic aquí</a>.</p>
  </div>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var orden = qs.get('orden');
      var token = qs.get('token');
      var url = '/checkout/exito/?orden=' + encodeURIComponent(orden || '');
      document.getElementById('manualLink').href = url;

      if (token) {
        var api = window.REFRI_API || 'http://127.0.0.1:8000';
        fetch(api + '/api/tienda/pagos/paypal/aprobar/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orden: orden, token: token }),
        })
          .then(function (res) { return res.json().catch(function () { return {}; }); })
          .then(function (data) {
            window.location.href = url;
          })
          .catch(function () {
            window.location.href = url;
          });
      } else {
        setTimeout(function () { window.location.href = url; }, 1500);
      }
    })();
  </script>
  <script src="/js/whatsapp.js"></script>
</body>
</html>
