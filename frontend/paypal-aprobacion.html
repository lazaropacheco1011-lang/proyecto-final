<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autorizando pago PayPal | RefriMaster</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      color: #0F172A;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .card {
      text-align: center;
      padding: 48px 40px;
      background: #fff;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      box-shadow: 0 20px 50px -20px rgba(2, 6, 23, 0.25);
      max-width: 420px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 4px solid #E0F2FE;
      border-top-color: #0284C7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #475569; font-size: 15px; margin: 0; }
    a { color: #0284C7; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 22px;
      border-radius: 12px;
      background: #0284C7;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .btn:hover { background: #0369A1; }
  </style>
</head>
<body>
  <div class="card">
    <div id="payLoading">
      <div class="spinner"></div>
      <h1>Autorizando tu pago con PayPal</h1>
      <p>Estamos confirmando la transacción. Serás redirigido a la confirmación del pedido cuando el pago esté aprobado.</p>
      <p style="margin-top: 16px; font-size: 13px;">Si la página se queda cargando, <a id="manualLink" href="/checkout/">regresa al pago</a>.</p>
    </div>
    <div id="payError" style="display:none;">
      <h1>No se pudo confirmar el pago</h1>
      <p id="payErrorMsg">Tu pago de PayPal no pudo ser confirmado.</p>
      <a class="btn" id="payBack" href="/checkout/">Volver al pago</a>
    </div>
  </div>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var orden = qs.get('orden');
      var token = qs.get('token');
      var url = '/checkout/exito/?orden=' + encodeURIComponent(orden || '');
      var api = new URLSearchParams(location.search).get('api') ||
                window.REFRI_API ||
                window.location.origin;

      function showError(msg) {
        var loading = document.getElementById('payLoading');
        var error = document.getElementById('payError');
        if (loading) loading.style.display = 'none';
        if (error) error.style.display = 'block';
        var em = document.getElementById('payErrorMsg');
        if (em && msg) em.textContent = msg;
        var back = document.getElementById('payBack');
        if (back) back.href = '/checkout/?orden=' + encodeURIComponent(orden || '');
      }

      function irConfirmacion() {
        window.location.href = url;
      }

      var manual = document.getElementById('manualLink');
      if (manual) manual.href = '/checkout/?orden=' + encodeURIComponent(orden || '');

      if (!orden || !token) {
        showError('No se recibió la referencia de pago de PayPal. Si tu pedido quedó pendiente, vuelve al pago para intentarlo.');
        return;
      }

      fetch(api + '/api/tienda/pagos/paypal/aprobar/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orden: orden, token: token }),
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            return { ok: res.ok, status: res.status, data: data };
          });
        })
        .then(function (r) {
          if (r.ok && r.data && r.data.estado_pago === 'aprobado') {
            irConfirmacion();
          } else {
            showError(
              (r.data && r.data.detail) ||
              'Tu pago de PayPal no se pudo capturar. Tu pedido quedó pendiente: vuelve al pago para intentarlo.'
            );
          }
        })
        .catch(function () {
          showError('No pudimos conectarnos con el servidor para confirmar tu pago. Vuelve al pago e inténtalo de nuevo.');
        });
    })();
  </script>
  <script src="/js/whatsapp.js"></script>
</body>
</html>
