        <text x="42" y="71" fill="#E2E8F0">Cámara Norte</text>
        <text x="42" y="88" fill="#7DD3FC">-18°C</text>
        <rect x="16" y="106" width="140" height="46" rx="9" fill="#0F172A" stroke="#334155"/>
        <circle cx="30" cy="129" r="4" fill="#22C55E"/>
        <text x="42" y="125" fill="#E2E8F0">Refrigerada</text>
