<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/><stop offset="1" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>
  <rect y="430" width="800" height="130" fill="#E0F2FE" opacity="0.7"/>

  <!-- wall -->
  <rect x="90" y="120" width="620" height="310" rx="10" fill="#ffffff" opacity="0.75"/>

  <!-- window -->
  <rect x="560" y="150" width="120" height="150" rx="8" fill="#0EA5E9" opacity="0.18"/>
  <rect x="570" y="160" width="100" height="130" rx="5" fill="#7DD3FC" opacity="0.5"/>
  <line x1="620" y1="160" x2="620" y2="290" stroke="#0EA5E9" stroke-width="3" opacity="0.5"/>
  <line x1="570" y1="225" x2="670" y2="225" stroke="#0EA5E9" stroke-width="3" opacity="0.5"/>

  <!-- split unit -->
  <g>
    <rect x="200" y="210" width="360" height="130" rx="14" fill="url(#unit)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="200" y="210" width="360" height="34" rx="14" fill="#0284C7"/>
    <rect x="200" y="230" width="360" height="14" fill="#0284C7"/>
    <text x="380" y="233" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">REFRIMASTER</text>
    <text x="380" y="252" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="600" letter-spacing="2">AIRE SPLIT · INVERTER</text>
    <!-- vents -->
    <g fill="#94A3B8">
      <rect x="215" y="265" width="46" height="8" rx="4"/>
      <rect x="275" y="265" width="46" height="8" rx="4"/>
      <rect x="335" y="265" width="46" height="8" rx="4"/>
      <rect x="395" y="265" width="46" height="8" rx="4"/>
      <rect x="455" y="265" width="46" height="8" rx="4"/>
    </g>
    <!-- status dot -->
    <circle cx="540" cy="228" r="6" fill="#22C55E"/>
    <text x="540" y="250" text-anchor="middle" fill="#475569" font-size="10">ON</text>
  </g>

  <!-- cool air flow -->
  <path d="M320 340 c -14 26 -14 44 2 64" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M440 340 c 14 26 14 44 -2 64" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M368 348 c -8 20 -8 34 3 50" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M392 348 c 8 20 8 34 -3 50" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- temperature badge -->
  <g transform="translate(560,60)">
    <circle cx="46" cy="46" r="46" fill="#0284C7"/>
    <circle cx="46" cy="46" r="38" fill="#0F172A" opacity="0.08"/>
    <text x="46" y="50" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">18°C</text>
    <text x="46" y="70" text-anchor="middle" fill="#E0F2FE" font-size="11">CONFORT</text>
  </g>

  <!-- snowflake icon top-left -->
  <g transform="translate(60,80)" stroke="#0284C7" stroke-width="4" stroke-linecap="round">
    <line x1="30" y1="0" x2="30" y2="60"/><line x1="0" y1="30" x2="60" y2="30"/>
    <line x1="9" y1="9" x2="51" y2="51"/><line x1="51" y1="9" x2="9" y2="51"/>
    <path d="M30 0 l-5 6 M30 0 l5 6 M30 60 l-5 -6 M30 60 l5 -6 M0 30 l6 -5 M0 30 l6 5 M60 30 l-6 -5 M60 30 l-6 5" stroke-width="3"/>
  </g>
</svg>
