<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/><stop offset="1" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>
  <rect y="420" width="800" height="140" fill="#E0F2FE" opacity="0.7"/>

  <!-- building facade -->
  <rect x="70" y="120" width="300" height="300" rx="10" fill="#ffffff" opacity="0.8"/>
  <g fill="#7DD3FC" opacity="0.55">
    <rect x="95" y="150" width="60" height="50" rx="4"/><rect x="180" y="150" width="60" height="50" rx="4"/><rect x="265" y="150" width="60" height="50" rx="4"/>
    <rect x="95" y="230" width="60" height="50" rx="4"/><rect x="180" y="230" width="60" height="50" rx="4"/><rect x="265" y="230" width="60" height="50" rx="4"/>
  </g>
  <rect x="95" y="315" width="230" height="30" rx="6" fill="#0284C7"/>
  <rect x="170" y="345" width="80" height="75" rx="6" fill="#0F172A" opacity="0.85"/>

  <!-- central unit (rooftop) -->
  <g>
    <rect x="400" y="210" width="330" height="150" rx="16" fill="url(#unit)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="400" y="210" width="330" height="38" rx="16" fill="#0284C7"/>
    <rect x="400" y="232" width="330" height="16" fill="#0284C7"/>
    <text x="565" y="235" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">UNIDAD CENTRAL</text>
    <!-- fan grille -->
    <circle cx="470" cy="295" r="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
      <line x1="470" y1="263" x2="470" y2="327"/><line x1="438" y1="295" x2="502" y2="295"/>
      <line x1="447" y1="272" x2="493" y2="318"/><line x1="493" y1="272" x2="447" y2="318"/>
    </g>
    <circle cx="470" cy="295" r="8" fill="#0284C7"/>
    <!-- vents -->
    <g fill="#94A3B8">
      <rect x="540" y="280" width="60" height="9" rx="4"/><rect x="620" y="280" width="60" height="9" rx="4"/>
      <rect x="540" y="300" width="60" height="9" rx="4"/><rect x="620" y="300" width="60" height="9" rx="4"/>
      <rect x="540" y="320" width="60" height="9" rx="4"/><rect x="620" y="320" width="60" height="9" rx="4"/>
    </g>
  </g>

  <!-- ducts connecting unit to building -->
  <path d="M400 250 H340" stroke="#CBD5E1" stroke-width="16" fill="none"/>
  <path d="M340 242 v-18 h-10" stroke="#CBD5E1" stroke-width="16" fill="none" stroke-linecap="round"/>
  <rect x="322" y="214" width="16" height="18" rx="4" fill="#94A3B8"/>

  <!-- cool air from unit -->
  <path d="M400 360 c -10 26 -4 44 10 60" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M470 370 c 0 28 8 42 24 56" stroke="#06B6D4" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M560 358 c 10 26 4 44 -10 60" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M640 364 c 0 28 -8 42 -24 56" stroke="#06B6D4" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- temp badge -->
  <g transform="translate(620,50)">
    <circle cx="46" cy="46" r="46" fill="#0284C7"/>
    <text x="46" y="50" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">21°C</text>
    <text x="46" y="70" text-anchor="middle" fill="#E0F2FE" font-size="11">CENTRAL</text>
  </g>

  <g transform="translate(50,70)" stroke="#0284C7" stroke-width="4" stroke-linecap="round">
    <line x1="30" y1="0" x2="30" y2="60"/><line x1="0" y1="30" x2="60" y2="30"/>
    <line x1="9" y1="9" x2="51" y2="51"/><line x1="51" y1="9" x2="9" y2="51"/>
    <path d="M30 0 l-5 6 M30 0 l5 6 M30 60 l-5 -6 M30 60 l5 -6 M0 30 l6 -5 M0 30 l6 5 M60 30 l-6 -5 M60 30 l-6 5" stroke-width="3"/>
  </g>
</svg>
